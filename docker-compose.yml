version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: naprzystanek-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: naprzystanek
    volumes:
      - ./mongo-data:/data/db
      - ./backend/otp/ztm:/data/csv
      - ./backend/mongodb_init.sh:/docker-entrypoint-initdb.d/init.sh

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: naprzystanek-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: "production"
      PORT: "4000"
      MONGO_URI: "mongodb://mongo:27017/naprzystanek"
      JWT_SECRET: "zmien_to_na_silny_klucz"
      FRONTEND_ORIGIN: "http://localhost:3000"
      OTP_BASE_URL: "http://otp:8080"
      GOOGLE_CLIENT_ID: "786973305172-gaf36n3tuqjm7v9eiu6ia19pga5mip3t.apps.googleusercontent.com"
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/otp/ztm:/app/otp/ztm

  otp:
    build:
      context: ./backend/otp
      dockerfile: Dockerfile
    container_name: naprzystanek-otp
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./backend/otp/ztm:/app/ztm

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: naprzystanek-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000"
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: "786973305172-gaf36n3tuqjm7v9eiu6ia19pga5mip3t.apps.googleusercontent.com"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend